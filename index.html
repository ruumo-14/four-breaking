<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>大乱闘＆相撲オンライン</title>
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      background-color: #2c3e50; 
      color: white; 
      font-family: sans-serif; 
    }
    
    #ui-container { 
      position: absolute; 
      top: 20px; 
      left: 20px; 
      background: rgba(0,0,0,0.8); 
      padding: 20px; 
      border-radius: 10px; 
      z-index: 100;
    }
    
    #canvas-2d { 
      display: none; 
      margin: 0 auto; 
      background: #ecf0f1; 
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    
    #status { 
      margin-top: 10px; 
      color: #f1c40f; 
      font-weight: bold;
    }

    /* =======================================
       📱 スマホ用コントローラーのスタイル
       ======================================= */
    #mobile-controls {
      position: absolute;
      bottom: 20px;
      width: 100%;
      display: none; /* 💻 基本（パソコン）は非表示 */
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
      z-index: 100;
    }

    /* 📱 タッチ操作対応の端末（スマホ等）の場合のみ表示 */
    @media (pointer: coarse) {
      #mobile-controls {
        display: flex;
      }
    }

    .d-pad, .action-pad { display: grid; gap: 10px; }
    .d-pad { grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px 50px; }
    .action-pad { grid-template-columns: 60px 60px; grid-template-rows: 60px 60px; }
    
    .btn { 
      background: rgba(255,255,255,0.2); 
      border: 2px solid white; 
      border-radius: 50%; 
      color: white; 
      font-weight: bold; 
      font-size: 14px; 
      user-select: none; 
      touch-action: none; 
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn:active { background: rgba(255,255,255,0.8); color: black; }
    
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 3; }
  </style>
</head>
<body>

  <!-- UIメニュー -->
  <div id="ui-container">
    <h2>ルーム接続</h2>
    <input type="text" id="new-room-input" placeholder="ルーム名" value="room1">
    <button id="btn-create-sumo">相撲モード</button>
    <button id="btn-create-2d">大乱闘モード</button>
    <div id="status">未接続</div>
  </div>

  <!-- 2D描画用キャンバス -->
  <canvas id="canvas-2d" width="800" height="600"></canvas>

  <!-- スマホ用コントローラー（CSSでPC時は非表示になります） -->
  <div id="mobile-controls">
    <div class="d-pad">
      <div id="btn-up" class="btn">上</div>
      <div id="btn-left" class="btn">左</div>
      <div id="btn-right" class="btn">右</div>
      <div id="btn-down" class="btn">下</div>
    </div>
    <div class="action-pad">
      <div id="btn-action" class="btn">A</div>
      <div id="btn-special" class="btn">B</div>
      <div id="btn-shield" class="btn">盾</div>
      <div id="btn-grab" class="btn">掴</div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
