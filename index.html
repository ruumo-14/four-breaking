<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 立体四目並べ オンライン</title>
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #222; color: white;}
      #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); z-index: 10; }
      .panel { background: #333; padding: 30px; border-radius: 10px; text-align: center; max-width: 400px; width: 100%;}
      input, button { font-size: 1.1rem; padding: 10px; margin: 5px; border-radius: 5px; border: none; }
      input { width: 80%; box-sizing: border-box; }
      button { cursor: pointer; font-weight: bold; width: 90%; }
      #btn-create { background: #ff4444; color: white; }
      .room-btn { background: #ffcc00; color: black; display: block; margin: 10px auto; }
      hr { margin: 25px 0; border-color: #555; }
      #status { position: absolute; top: 20px; left: 20px; font-size: 1.5rem; font-weight: bold; z-index: 5; text-shadow: 2px 2px 4px #000; pointer-events: none;}
      #room-list-container { max-height: 150px; overflow-y: auto; background: #222; padding: 10px; border-radius: 5px;}
    </style>
  </head>
  <body>
    <div id="ui-container">
      <div class="panel">
        <h2>3D 立体四目並べ</h2>
        
        <!-- 部屋を作るエリア -->
        <div>
          <p>▼ 新しく部屋を作る</p>
          <input type="text" id="new-room-input" placeholder="部屋の名前を入力" />
          <button id="btn-create">部屋を作って待つ (先手/赤)</button>
        </div>

        <hr>

        <!-- 部屋一覧エリア -->
        <div>
          <p>▼ 参加できる部屋一覧</p>
          <div id="room-list-container">
            <p style="font-size: 0.9rem; color: #aaa;">待機中の部屋はありません</p>
          </div>
        </div>
      </div>
    </div>
    <div id="status"></div>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
