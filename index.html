<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>オンライン対戦ゲーム ポータル</title>
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #222; color: white; touch-action: none; }
      
      /* ロビー画面 */
      #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); z-index: 20; }
      .panel { background: #333; padding: 30px; border-radius: 10px; text-align: center; max-width: 450px; width: 100%;}
      input, button { font-size: 1.1rem; padding: 10px; margin: 5px; border-radius: 5px; border: none; }
      input[type="text"] { width: 80%; box-sizing: border-box; }
      button { cursor: pointer; font-weight: bold; width: 90%; }
      
      /* ゲーム選択ボタンの色 */
      #btn-create-c4 { background: #ff4444; color: white; }
      #btn-create-sumo { background: #3498db; color: white; }
      #btn-create-2d { background: #2ecc71; color: white; }
      
      .room-btn-c4 { background: #ffcc00; color: black; display: block; margin: 10px auto; }
      .room-btn-sumo { background: #9b59b6; color: white; display: block; margin: 10px auto; }
      .room-btn-2d { background: #1abc9c; color: white; display: block; margin: 10px auto; }
      hr { margin: 25px 0; border-color: #555; }
      #room-list-container { max-height: 150px; overflow-y: auto; background: #222; padding: 10px; border-radius: 5px;}
      
      /* ステータス表示 */
      #status { position: absolute; top: 20px; left: 0; width: 100%; font-size: 1.5rem; font-weight: bold; z-index: 5; text-shadow: 2px 2px 4px #000; text-align: center; pointer-events: none;}
      
      /* 四目並べ用チャット */
      #chat-container { display: none; position: absolute; bottom: 20px; right: 20px; width: 300px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; z-index: 10; border: 1px solid #555; }
      #chat-messages { height: 150px; overflow-y: auto; margin-bottom: 10px; font-size: 0.9rem; padding-right: 5px; word-wrap: break-word;}
      #chat-input-area { display: flex; }
      #chat-input { flex: 1; padding: 8px; border-radius: 4px 0 0 4px; }
      #btn-send { width: auto; padding: 8px 15px; background: #4caf50; color: white; }

      /* スマホ向け操作パッド（相撲＆2Dアクション共通） */
      #controls { display: none; position: absolute; bottom: 20px; left: 0; width: 100%; z-index: 10; flex-direction: row; justify-content: space-between; padding: 0 20px; box-sizing: border-box; }
      .d-pad { display: grid; grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px 60px; gap: 5px; }
      .ctrl-btn { background: rgba(255,255,255,0.3); border: 2px solid white; border-radius: 10px; color: white; font-size: 1.5rem; font-weight: bold; display: flex; justify-content: center; align-items: center; user-select: none; }
      .ctrl-btn:active { background: rgba(255,255,255,0.7); color: black; }
      #btn-up { grid-column: 2; grid-row: 1; }
      #btn-left { grid-column: 1; grid-row: 2; }
      #btn-down { grid-column: 2; grid-row: 2; }
      #btn-right { grid-column: 3; grid-row: 2; }
      #action-pad { display: flex; align-items: center; margin-right: 20px;}
      #btn-action { width: 90px; height: 90px; border-radius: 50%; background: rgba(231, 76, 60, 0.7); border: 3px solid #ff7979; font-size: 1.1rem; line-height: 1.2; }
      #btn-action:active { background: rgba(231, 76, 60, 1); transform: scale(0.95); }
      #pc-hint { display: none; position: absolute; top: 60px; left: 0; width: 100%; text-align: center; font-size: 0.9rem; color: #ccc; z-index: 5; pointer-events: none; text-shadow: 1px 1px 2px #000;}

      /* 2Dゲーム用キャンバス */
      #canvas-2d { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: contain; background-color: #2c3e50; z-index: 1; }
      /* 3Dゲーム用キャンバス */
      #app { position: absolute; top: 0; left: 0; z-index: 0; }
    </style>
  </head>
  <body>
    <!-- ロビー -->
    <div id="ui-container">
      <div class="panel">
        <h2>🎮 オンライン対戦ゲーム ポータル</h2>
        <div>
          <input type="text" id="new-room-input" placeholder="合言葉（例: room123）" />
          <button id="btn-create-c4">🔴 立体四目並べ (ボードゲーム)</button>
          <button id="btn-create-sumo">🚘 3Dドタバタ相撲 (アクション)</button>
          <button id="btn-create-2d">⚔️ 2D魔法シューティング (アクション)</button>
        </div>
        <hr>
        <div>
          <p>▼ 参加できる部屋一覧</p>
          <div id="room-list-container">
            <p style="font-size: 0.9rem; color: #aaa;">待機中の部屋はありません</p>
          </div>
        </div>
      </div>
    </div>
    
    <div id="status"></div>
    <div id="pc-hint">PC操作: [W][A][S][D] で移動 / [スペースキー] でアクション</div>
    
    <div id="chat-container">
      <div id="chat-messages"></div>
      <div id="chat-input-area">
        <input type="text" id="chat-input" placeholder="メッセージ..." />
        <button id="btn-send">送信</button>
      </div>
    </div>

    <!-- スマホ操作パッド -->
    <div id="controls">
      <div class="d-pad">
        <div class="ctrl-btn" id="btn-up">▲</div>
        <div class="ctrl-btn" id="btn-left">◀</div>
        <div class="ctrl-btn" id="btn-down">▼</div>
        <div class="ctrl-btn" id="btn-right">▶</div>
      </div>
      <div id="action-pad">
        <div class="ctrl-btn" id="btn-action">タックル<br>魔法</div>
      </div>
    </div>

    <!-- 2D用と3D用の描画エリア -->
    <canvas id="canvas-2d" width="800" height="600"></canvas>
    <div id="app"></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
