<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>「弧」漢字辞書・確認するならポウンド</title>
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #222; color: white; touch-action: none; }
      
      #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); z-index: 20; }
      .panel { background: #333; padding: 25px; border-radius: 10px; text-align: center; max-width: 450px; width: 90%; box-sizing: border-box;}
      input, button { font-size: 1rem; padding: 10px; margin: 5px; border-radius: 5px; border: none; }
      input[type="text"] { width: 80%; box-sizing: border-box; }
      button { cursor: pointer; font-weight: bold; width: 90%; }
      
      .btn-create { background: #e74c3c; color: white; }
      .btn-game-oni { background: #e67e22; color: white; }
      .btn-game-card { background: #8e44ad; color: white; }
      .btn-game-2d { background: #2ecc71; color: white; }
      .btn-game-sumo { background: #3498db; color: white; }
      .btn-game-c4 { background: #f1c40f; color: black; }
      
      .room-btn { background: #f39c12; color: white; display: block; margin: 8px auto; }
      
      hr { margin: 20px 0; border-color: #555; }
      #room-list-container { max-height: 120px; overflow-y: auto; background: #222; padding: 10px; border-radius: 5px;}
      
      #status { position: absolute; top: 20px; left: 0; width: 100%; font-size: 1.5rem; font-weight: bold; z-index: 5; text-shadow: 2px 2px 4px #000; text-align: center; pointer-events: none;}
      #controls-display { display: none; position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; border: 1px solid #555; font-size: 0.95rem; z-index: 15; text-align: left; line-height: 1.5; pointer-events: none;}

      /* 鬼ごっこ用スタミナUI */
      #stamina-container { display: none; position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); width: 200px; background: rgba(0,0,0,0.5); border: 2px solid #fff; border-radius: 10px; padding: 3px; z-index: 10; }
      #stamina-bar { width: 100%; height: 15px; background: #2ecc71; border-radius: 5px; transition: width 0.1s linear; }

      /* ルーレット抽選オーバーレイ */
      #roulette-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 50; flex-direction: column; justify-content: center; align-items: center; }
      #roulette-text { font-size: 2.5rem; font-weight: bold; color: #f1c40f; margin-bottom: 20px; text-shadow: 0 0 10px #f39c12; }

      /* チャット */
      #chat-container { display: block; position: absolute; bottom: 20px; right: 20px; width: 300px; background: rgba(0,0,0,0.8); padding: 12px; border-radius: 8px; z-index: 30; border: 1px solid #555; }
      #chat-title { font-size: 0.85rem; font-weight: bold; color: #aaa; margin-bottom: 5px; text-align: left; }
      #chat-messages { height: 130px; overflow-y: auto; margin-bottom: 8px; font-size: 0.85rem; padding-right: 5px; word-wrap: break-word; text-align: left;}
      #chat-input-area { display: flex; }
      #chat-input { flex: 1; padding: 6px; border-radius: 4px 0 0 4px; font-size: 0.9rem; }
      #btn-send { width: auto; padding: 6px 12px; background: #4caf50; color: white; font-size: 0.9rem; margin: 0; border-radius: 0 4px 4px 0; }

      /* スマホ操作パッド */
      #controls { display: none; position: absolute; bottom: 20px; left: 20px; z-index: 10; flex-direction: row; justify-content: space-between; box-sizing: border-box; }
      @media (pointer: coarse) { #controls { display: flex; } }
      .d-pad { display: grid; grid-template-columns: 55px 55px 55px; grid-template-rows: 55px 55px 55px; gap: 5px; }
      .ctrl-btn { background: rgba(255,255,255,0.3); border: 2px solid white; border-radius: 10px; color: white; font-size: 1.3rem; font-weight: bold; display: flex; justify-content: center; align-items: center; user-select: none; }
      .ctrl-btn:active { background: rgba(255,255,255,0.7); color: black; }
      #btn-up { grid-column: 2; grid-row: 1; }
      #btn-left { grid-column: 1; grid-row: 2; }
      #btn-down { grid-column: 2; grid-row: 2; }
      #btn-right { grid-column: 3; grid-row: 2; }
      
      #action-pad { display: grid; grid-template-columns: 55px 55px 55px; grid-template-rows: 55px 55px 55px; gap: 5px; margin-left: 20px;}
      .act-btn { border-radius: 50%; font-size: 1rem; color: white; font-weight: bold; display: flex; justify-content: center; align-items: center; user-select: none; border: 2px solid rgba(255,255,255,0.6); }
      .act-btn:active { transform: scale(0.9); }
      #btn-grab { grid-column: 2; grid-row: 1; background: rgba(155, 89, 182, 0.8); }
      #btn-shield { grid-column: 1; grid-row: 2; background: rgba(52, 152, 219, 0.8); }
      #btn-action { grid-column: 3; grid-row: 2; background: rgba(231, 76, 60, 0.8); }
      #btn-special { grid-column: 2; grid-row: 3; background: rgba(241, 196, 15, 0.8); color: black;}

      #canvas-2d { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: contain; background-color: #2c3e50; z-index: 1; }
      #app { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; }
    </style>
  </head>
  <body>
    <!-- ロビー・部屋選択・セレクト画面共通エリア -->
    <div id="ui-container">
      <div class="panel" id="panel-lobby">
        <h2>🎮 オンライン対戦ポウンド</h2>
        <div>
          <input type="text" id="new-room-input" placeholder="合言葉（例: room123）" />
          <button id="btn-create-room" class="btn-create">🚪 部屋を作成して入る</button>
        </div>
        <hr>
        <div>
          <p>▼ 待機中の部屋一覧</p>
          <div id="room-list-container">
            <p style="font-size: 0.9rem; color: #aaa;">待機中の部屋はありません</p>
          </div>
        </div>
      </div>

      <!-- セレクト画面 -->
      <div class="panel" id="panel-select" style="display: none;">
        <h2 id="room-title">🏠 部屋：---</h2>
        <p style="color: #4caf50;" id="room-status-text">相手の接続を待っています...</p>
        <p style="font-size: 0.9rem; color: #ccc;">投票するゲームを選んでください（抽選で決定）</p>
        <div>
          <button id="btn-select-oni" class="btn-game-oni">🏃 モール鬼ごっこ (追跡・逃走)</button>
          <button id="btn-select-card" class="btn-game-card">🃏 カードバトラー (数字勝負)</button>
          <button id="btn-select-2d" class="btn-game-2d">⚔️ 2D大乱闘バッシュ (スマブラ風)</button>
          <button id="btn-select-sumo" class="btn-game-sumo">🚘 3Dドタバタ相撲 (弾き飛ばし)</button>
          <button id="btn-select-c4" class="btn-game-c4">🔴 立体四目並べ (ボードゲーム)</button>
        </div>
      </div>
    </div>
    
    <!-- 抽選ルーレット演出 -->
    <div id="roulette-overlay">
      <div style="font-size: 1.2rem; color: #aaa;">🎲 ゲームを抽選中...</div>
      <div id="roulette-text">選択中...</div>
    </div>

    <!-- スタミナバー -->
    <div id="stamina-container">
      <div id="stamina-bar"></div>
    </div>

    <div id="status"></div>
    <div id="controls-display"></div>
    
    <!-- チャット -->
    <div id="chat-container">
      <div id="chat-title">💬 部屋チャット</div>
      <div id="chat-messages"></div>
      <div id="chat-input-area">
        <input type="text" id="chat-input" placeholder="メッセージ..." />
        <button id="btn-send">送信</button>
      </div>
    </div>

    <!-- スマホ操作パッド -->
    <div id="controls">
      <div class="d-pad">
        <div class="ctrl-btn" id="btn-up">▲</div>
        <div class="ctrl-btn" id="btn-left">◀</div>
        <div class="ctrl-btn" id="btn-down">▼</div>
        <div class="ctrl-btn" id="btn-right">▶</div>
      </div>
      <div id="action-pad">
        <div class="act-btn" id="btn-grab">掴</div>
        <div class="act-btn" id="btn-shield">ダッシュ</div>
        <div class="act-btn" id="btn-action">A</div>
        <div class="act-btn" id="btn-special">B</div>
      </div>
    </div>

    <canvas id="canvas-2d" width="800" height="600"></canvas>
    <div id="app"></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
